<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des compétences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--sf:#fff;--ink:#1d2433;--mu:#6b7385;--ln:#e3e7ef;--pr:#3056d3;--prl:#e8eefc;
--n1:#e5484d;--n1l:#fdecec;--n2:#e8890c;--n2l:#fff1dc;--n3:#2a9d63;--n3l:#e3f5eb;--n4:#2b6cd4;--n4l:#e4edfc;--n0:#a2a9b8;--n0l:#eef0f4;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
#demo:empty{display:none}
#demo{background:#fff4cf;color:#6e5200;text-align:center;padding:7px 12px;font-size:13px;font-weight:700}
.wrap{max-width:1000px;margin:0 auto;padding:26px 16px 90px}
.wrap.narrow{max-width:520px}
.brand{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--pr);display:grid;place-items:center;flex:none}
.logo svg{width:28px;height:28px}
h1{font-size:27px;margin:0;font-weight:900;line-height:1.1}
h2{font-size:22px;margin:0;font-weight:900}
.sub{color:var(--mu);font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;background:var(--pr);color:#fff;font-weight:800;font-size:15px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--prl);color:var(--pr)}
.btn.ghost{background:var(--sf);color:var(--mu);border:1.5px solid var(--ln)}
.btn.ghost:hover{color:var(--ink);border-color:#c9cfdb;filter:none}
.btn.danger{background:var(--n1);color:#fff}
.btn.ghost.danger{background:var(--sf);color:var(--n1);border-color:#f3c4c5}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.empty{text-align:center;color:var(--mu);font-weight:700;padding:34px 18px}
.foot{margin-top:40px;text-align:center}
.back{color:var(--mu);font-weight:800;font-size:15px;padding:6px 0;margin-bottom:6px}
.back:hover{color:var(--pr)}
.niv-title{font-weight:900;color:var(--mu);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 9px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.cbtn{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:22px 8px;font-size:24px;font-weight:900;transition:.15s}
.cbtn:hover{border-color:var(--pr);color:var(--pr);transform:translateY(-2px)}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.nbtn{text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:15px 16px;font-size:17px;font-weight:600;transition:.15s}
.nbtn b{font-weight:900}
.nbtn:hover{border-color:var(--pr);color:var(--pr)}
.dots{display:flex;gap:16px;justify-content:center;margin:10px 0 14px}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--pr);transition:.15s}
.dot.on{background:var(--pr)}
.msg{text-align:center;font-weight:800;min-height:24px;margin:6px 0}
.msg.err{color:var(--n1)}
.pad{display:grid;grid-template-columns:repeat(3,86px);gap:12px;justify-content:center;margin-top:14px}
.key{height:74px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:28px;font-weight:900;transition:.1s}
.key:hover{border-color:var(--pr)}
.key:active{background:var(--prl);transform:scale(.96)}
.key.sm{font-size:15px;color:var(--mu)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hello{font-size:26px;font-weight:900}
.tabs{display:flex;gap:6px;background:#e7eaf2;padding:4px;border-radius:12px;width:fit-content;margin-bottom:20px}
.tab{padding:9px 18px;border-radius:9px;font-weight:800;color:var(--mu)}
.tab.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.1)}
.tpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tpcard{text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.tpcard:hover{border-color:var(--pr);transform:translateY(-2px)}
.tpt{font-size:18px;font-weight:900}
.prog{height:9px;background:#e9edf4;border-radius:6px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.tpm{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--mu)}
.tpm .ok{color:var(--n3)}
.tph{margin:4px 0 4px}
.cgroup{margin-top:22px}
.cghead{display:flex;align-items:center;gap:10px;font-size:16px}
.cghead b{font-weight:900}
.ccard{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-top:10px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:900;color:#fff;white-space:nowrap}
.code{font-weight:900;font-size:13px;color:var(--mu)}
.crit{font-size:13px;font-weight:800;color:var(--pr);padding:4px 10px;border-radius:8px;background:var(--prl)}
.crit.on{background:var(--pr);color:#fff}
.cel{font-size:18px;font-weight:800;margin-top:6px}
ul.ind{margin:10px 0 0;padding:10px 12px 10px 30px;background:#f6f8fc;border-radius:10px;font-size:14px;font-weight:600;color:#3b4457}
ul.ind li{margin:3px 0}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.lvls.n3{grid-template-columns:repeat(3,1fr)}
.lvl{border:2px solid var(--ln);border-radius:13px;padding:13px 6px;background:var(--sf);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.12s;color:var(--ink)}
.lvl:hover{border-color:var(--lc)}
.lvl.on{border-color:var(--lc);background:var(--ll);color:var(--lc)}
.l1{--lc:var(--n1);--ll:var(--n1l)}.l2{--lc:var(--n2);--ll:var(--n2l)}.l3{--lc:var(--n3);--ll:var(--n3l)}.l4{--lc:var(--n4);--ll:var(--n4l)}
.gauge{display:flex;gap:4px;align-items:flex-end;height:24px}
.gauge i{width:8px;border-radius:2px;background:#dfe3ea}
.gauge i.f{background:var(--lc)}
.prof{margin-top:12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--mu);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:8px;font-weight:900;font-size:13px;white-space:nowrap}
.b0{background:var(--n0l);color:var(--n0)}.b1{background:var(--n1l);color:var(--n1)}.b2{background:var(--n2l);color:var(--n2)}.b3{background:var(--n3l);color:var(--n3)}.b4{background:var(--n4l);color:var(--n4)}
.progtop{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:6px}
.big{font-size:21px;font-weight:900;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;font-weight:700;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block}
.sw.s0{background:var(--n0l);border:1px solid #d6dae3}.sw.s1{background:var(--n1)}.sw.s2{background:var(--n2)}.sw.s3{background:var(--n3)}.sw.s4{background:var(--n4)}
.dtitle{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;margin:24px 0 10px}
.dtitle i{width:12px;height:12px;border-radius:4px;flex:none}
.cmp{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;overflow:hidden}
.cmph{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px 8px;text-align:left}
.cmpl{font-weight:800;font-size:15px}
.cmpn{font-weight:900;font-size:14px;color:var(--mu)}
.segbar{display:flex;gap:3px;padding:0 16px 14px}
.segbar i{flex:1;height:10px;border-radius:3px}
.segbar i.c0{background:#e6e9f0}.segbar i.c1{background:var(--n1)}.segbar i.c2{background:var(--n2)}.segbar i.c3{background:var(--n3)}.segbar i.c4{background:var(--n4)}
.arow{display:grid;grid-template-columns:62px 1fr auto auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln);font-size:14px}
.arow .al{font-weight:700}
.tdots{display:flex;gap:4px}
.arow3{display:grid;grid-template-columns:62px 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--ln);font-size:14px}
.arow3 .al{font-weight:700;margin-bottom:4px}
.crit.sm{font-size:12px;padding:3px 8px}
.who{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lab{font-size:11px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.seg.big .sg{padding:8px 11px;font-size:13px}
.td{width:26px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:900}
/* admin */
.adm{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{background:var(--sf);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
.sbrand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.sbrand .logo{width:38px;height:38px;border-radius:11px}.sbrand .logo svg{width:22px;height:22px}
.side .it{text-align:left;padding:10px 12px;border-radius:10px;font-weight:800;color:var(--mu);display:flex;gap:11px;align-items:center;font-size:15px}
.side .it:hover{color:var(--ink);background:#f3f5f9}
.side .it.on{background:var(--prl);color:var(--pr)}
.side svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .sp{flex:1}
.main{padding:24px 28px 120px;min-width:0}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--pr)}
select.inp{width:auto;font-weight:800;cursor:pointer}
textarea.inp{min-height:100px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;font-weight:800;font-size:13px;color:var(--mu);margin-bottom:5px}
.per{display:flex;background:#e7eaf2;padding:3px;border-radius:10px;gap:3px}
.pchip{padding:6px 12px;border-radius:8px;font-weight:800;font-size:13px;color:var(--mu)}
.pchip.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.1)}
.ctiles{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.ctile{position:relative;overflow:hidden;background:var(--sf);border:1.5px solid var(--ln);border-radius:11px;padding:8px 14px 11px;min-width:96px;text-align:left;display:flex;flex-direction:column}
.ctile b{font-size:15px}.ctile span{font-size:12px;color:var(--mu);font-weight:800}
.ctile i{position:absolute;left:0;bottom:0;height:4px;background:var(--n3)}
.ctile.on{border-color:var(--pr);background:var(--prl)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;text-align:left}
.kpi .v{font-size:28px;font-weight:900;line-height:1.1}
.kpi .k{color:var(--mu);font-size:13px;font-weight:800}
button.kpi:hover{border-color:var(--pr)}
.kpi.warn .v{color:var(--n2)}
.sec{margin-bottom:16px}
.sec h3{margin:0 0 4px;font-size:16px;font-weight:900}
.sec .sub{margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.brow{display:grid;grid-template-columns:minmax(140px,300px) 1fr 52px;gap:12px;align-items:center;margin:6px 0;font-size:14px;width:100%;text-align:left;padding:3px 0}
button.brow:hover .bl{color:var(--pr)}
.brow .bl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bl b{font-weight:900;margin-right:6px}
.brow.subr{font-size:13px}
.brow.subr .bl{padding-left:22px;color:var(--mu)}
.stack{height:20px;border-radius:6px;overflow:hidden;display:flex;background:var(--n0l)}
.brow.subr .stack{height:12px}
.stack i{height:100%}
.brow .bp{font-weight:900;text-align:right}
.scroll{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;font-size:13px}
table.hm th{font-size:12px;font-weight:900;color:var(--mu);padding:3px;white-space:nowrap}
td.nm{padding-right:10px;white-space:nowrap}
.nmb{font-weight:700;font-size:14px;color:var(--ink);text-align:left}
.nmb:hover{color:var(--pr);text-decoration:underline}
.hc{display:grid;place-items:center;width:48px;height:30px;border-radius:7px;font-weight:900;font-size:11px}
.c0{background:var(--n0l);color:var(--n0)}.c1{background:var(--n1l);color:var(--n1)}.c2{background:var(--n2l);color:var(--n2)}.c3{background:var(--n3l);color:var(--n3)}.c4{background:var(--n4l);color:var(--n4)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}
.lrow:last-child{border-bottom:none}
.tpp{margin:12px 0}
.tpp .tn{font-weight:800;font-size:14px;margin-bottom:5px}
.tpp .prog{margin:4px 0}
.cov{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cov span{background:var(--n0l);color:#5a6378;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:800}
.cellb{width:52px;height:38px;border-radius:8px;font-weight:900;font-size:12px;position:relative;border:2.5px solid transparent;transition:transform .1s}
.cellb:hover{transform:scale(1.07)}
.cellb .ad{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff}
.cellb.sel{border-color:var(--ink)}
table.ev{border-collapse:separate;border-spacing:4px}
table.ev th{font-size:12px;font-weight:900;color:var(--mu);padding:4px}
table.ev th.gh{color:var(--ink);font-size:13px;padding-bottom:6px}
.hint{font-size:13px;color:var(--mu);font-weight:700;margin:4px 0 14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.bar .sp{flex:1}
.picker{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--sf);border:1px solid var(--ln);box-shadow:0 12px 34px rgba(20,30,60,.2);border-radius:16px;padding:12px 14px;display:flex;gap:8px;align-items:center;z-index:30;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.pinfo{display:flex;flex-direction:column;font-size:13px;margin-right:6px;min-width:170px;max-width:300px}
.pinfo b{font-size:15px}
.pk{min-width:58px;height:46px;border-radius:10px;font-weight:900;border:2.5px solid transparent;padding:0 8px}
.pk.on{border-color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,28,48,.42);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--sf);border-radius:18px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;padding:22px;cursor:default}
.fsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.fs{border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px}
.fs b{font-size:13px;color:var(--mu);font-weight:900;display:block}
.fs .v{font-size:22px;font-weight:900}
.fs .n{font-size:13px;font-weight:800;color:var(--mu)}
.fs.cur{border-color:var(--pr);background:var(--prl)}
table.fiche{width:100%;border-collapse:collapse;font-size:14px}
table.fiche td,table.fiche th{padding:7px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
table.fiche th{font-size:12px;color:var(--mu);font-weight:900;text-align:center}
table.fiche tr.ch td{background:#f6f8fc;font-weight:900;border-bottom:none;padding-top:12px}
table.fiche tr.bh td{font-weight:900;font-size:15px;padding-top:18px;border-bottom:2px solid var(--ln)}
table.fiche td.cd{font-weight:900;color:var(--mu);white-space:nowrap;font-size:13px}
table.fiche td.ct{text-align:center}
.mini{display:inline-grid;place-items:center;min-width:36px;height:24px;border-radius:6px;font-weight:900;font-size:11px}
.seg{display:inline-flex;border:1.5px solid var(--ln);border-radius:9px;overflow:hidden}
.sg{padding:5px 9px;font-weight:900;font-size:12px;color:var(--mu);background:var(--sf);border-left:1px solid var(--ln)}
.sg:first-child{border-left:none}
.sg:hover{background:#f3f5f9}
.sg.on.c1{background:var(--n1);color:#fff}.sg.on.c2{background:var(--n2);color:#fff}.sg.on.c3{background:var(--n3);color:#fff}.sg.on.c4{background:var(--n4);color:#fff}
.trow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.cchip{background:var(--prl);color:var(--pr);border-radius:7px;padding:2px 8px;font-size:12px;font-weight:900}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13px;cursor:pointer;color:var(--mu)}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:#d3d8e2;position:relative;cursor:pointer;transition:.15s;margin:0}
.switch input::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--n3)}
.switch input:checked::after{left:19px}
.chkgrid{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px}
.chk{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1.5px solid var(--ln);border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;background:var(--sf)}
.chk.on{border-color:var(--pr);background:var(--prl);color:var(--pr)}
.chk input{margin:0;accent-color:var(--pr);flex:none}
.chk.wide{width:100%}
.chk b{min-width:58px}
.glabel{display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px;margin-top:12px;flex-wrap:wrap}
.arow2{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--ln)}
.arow2 .cl{font-weight:800;font-size:14px}
.arow2 .ix{font-size:12.5px;color:var(--mu);font-weight:600;margin-top:3px}
.confirm{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--n1)}
.codev{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:17px;letter-spacing:.12em}
table.lst{width:100%;border-collapse:collapse;font-size:14px}
table.lst td,table.lst th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}
table.lst th{font-size:12px;color:var(--mu);font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mopt{text-align:left;border:2px solid var(--ln);border-radius:12px;padding:12px 14px;background:var(--sf)}
.mopt b{display:block;font-size:15px}
.mopt.on{border-color:var(--pr);background:var(--prl)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--mu)}

const io=new IntersectionObserver(es=>es.forEach(e=>{const sc=scenes.find(s=>s.sec===e.target);if(e.isIntersecting&&!sc.active){sc.active=true;loop(sc)}else if(!e.isIntersecting&&sc.active){sc.active=false;sc.stop=true;sc.gen++}}),{root:SC,threshold:.35});

/* ===== Stockage : Firebase REST (sans SDK) ou mémoire en mode démo ===== */
function clone(v){return v==null?null:JSON.parse(JSON.stringify(v))}
let MEM={};
const parts=p=>p.split('/').filter(Boolean);
function memGet(p){let o=MEM;for(const k of parts(p)){if(o==null||typeof o!=='object')return null;o=o[k]}return o===undefined?null:o}
function memSet(p,v){const a=parts(p);if(!a.length){MEM=v||{};return}let o=MEM;for(let i=0;i<a.length-1;i++){if(typeof o[a[i]]!=='object'||o[a[i]]===null)o[a[i]]={};o=o[a[i]]}const k=a[a.length-1];if(v===null||v===undefined)delete o[k];else o[k]=v}
const Store={
 async req(method,p,v){
  if(DEMO){
   if(method==='GET')return clone(memGet(p));
   if(method==='PUT')memSet(p,clone(v));
   else if(method==='PATCH'){for(const k in v)memSet(p+'/'+k,clone(v[k]))}
   else if(method==='DELETE')memSet(p,null);
   return true;
  }
  const opt={method};if(v!==undefined)opt.body=JSON.stringify(v);
  const r=await fetch(`${FB_URL}/${p?ROOT+'/'+p:ROOT}.json`,opt);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return method==='GET'?await r.json():true;
 },
 get(p){return this.req('GET',p)},put(p,v){return this.req('PUT',p,v)},patch(p,v){return this.req('PATCH',p,v)},del(p){return this.req('DELETE',p)}
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const pl=(n,s,p)=>n+' '+(n>1?(p||s+'s'):s);
const newCodeVal=()=>String(Math.floor(Math.random()*10000)).padStart(4,'0');
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className='toast'},1900)}
async function safe(p){try{await p;return true}catch(e){toast('Connexion impossible : modification non enregistrée',true);return false}}
async function hash(s){const b=new TextEncoder().encode('suivi-comp|'+s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

 admin:false,db:null,a:'dash',ac:null,atp:null,cell:null,edTp:null,edAct:null,edComp:null,confirm:null,ficheEid:null,fy:null,fp:0,evSel:null,pendingImport:null,per:0,openC:{},setupRef:'mfer'};

/* ===== Accès au référentiel ===== */
const LV=()=>ECH[(S.cfg&&S.cfg.echelle)||'e3']||ECH.e3;
const NL=()=>LV().length;
const L=n=>LV()[n-1]||{s:'',nom:'',el:''};
const lvls=()=>LV().map((_,i)=>i+1);
const OK=()=>3;
function normCfg(){
 const c=S.cfg;if(!c)return false;let mig=false;
 if(!c.actions&&c.competences&&Object.values(c.competences).some(x=>x&&x.dom)){
  const b=buildC4();c.actions={};
  Object.entries(c.competences).forEach(([id,x])=>{c.actions[id]={code:x.code,comp:x.dom,lib:x.lib,el:x.el||'',ind:[],o:x.o||0}});
  Object.assign(c,{competences:b.competences,blocs:b.blocs,echelle:'e4',ref:'c4',titre:b.titre});delete c.domaines;
  Object.values(c.tps||{}).forEach(t=>{if(t&&t.comps&&!t.acts){t.acts=t.comps;delete t.comps}});mig=true;
 }
 c.classes=c.classes||[];c.tps=c.tps||{};c.blocs=c.blocs||{};c.competences=c.competences||{};c.actions=c.actions||{};
 c.echelle=c.echelle||'e3';c.mode=c.mode||'derniere';c.seuil=c.seuil||50;c.trims=c.trims||{t2:'12-01',t3:'03-01'};c.titre=c.titre||'';c.ref=c.ref||'mfer';c.logos=c.logos||{};
 Object.values(c.actions).forEach(a=>{if(!Array.isArray(a.ind))a.ind=a.ind?[].concat(a.ind):[]});
 return mig;
}
const blocsSorted=()=>Object.entries(S.cfg.blocs||{}).sort((a,b)=>(a[1].o||0)-(b[1].o||0)||a[0].localeCompare(b[0]));
const compsSorted=()=>Object.entries(S.cfg.competences||{}).sort((a,b)=>(a[1].o||0)-(b[1].o||0));
function sortAids(ids){const A=S.cfg.actions,C=S.cfg.competences;return [...new Set(ids)].filter(id=>A[id]&&C[A[id].comp]).sort((x,y)=>((C[A[x].comp].o||0)-(C[A[y].comp].o||0))||((A[x].o||0)-(A[y].o||0)))}
const allAids=()=>sortAids(Object.keys(S.cfg.actions));
const tpActs=t=>sortAids((t&&t.acts)||[]);
const compColor=cid=>{const c=S.cfg.competences[cid]||{};return c.c||((S.cfg.blocs||{})[c.bloc]||{}).c||'#55657e'};
function groupByComp(aids){const g=[];let cur=null;aids.forEach(a=>{const cid=S.cfg.actions[a].comp;if(!cur||cur[0]!==cid){cur=[cid,[]];g.push(cur)}cur[1].push(a)});return g}
function byBloc(groups){const m={};groups.forEach(g=>{const b=S.cfg.competences[g[0]].bloc||'_';(m[b]=m[b]||[]).push(g)});
 const order=blocsSorted().map(x=>x[0]).concat(Object.keys(m).filter(k=>!S.cfg.blocs[k]));return order.filter(b=>m[b]).map(b=>[b,m[b]])}
const blocName=b=>(S.cfg.blocs[b]||{}).nom||'Autres';
const blocColor=b=>(S.cfg.blocs[b]||{}).c||'#55657e';
/* Sources d'évaluation : un TP existant, ou une saisie hors TP (_d…, ancien _dir) */
const isDirect=t=>/^_d/.test(t);
const validTid=t=>isDirect(t)||!!(S.cfg.tps&&S.cfg.tps[t]);
const srcName=t=>isDirect(t)?'Évaluation hors TP':((S.cfg.tps[t]||{}).titre||'TP supprimé');

/* ===== Calculs : cumul des évaluations du professeur ===== */
function events(E,aid,rg){
 const from=rg?rg[0]:-Infinity,to=rg?rg[1]:Infinity,out=[];
 for(const tid in E||{}){if(!validTid(tid))continue;const x=E[tid]&&E[tid][aid];if(!x||!x.p)continue;const t=x.tq||0;if(t<from||t>=to)continue;out.push({tid,aid,p:x.p,t})}
 return out.sort((a,b)=>a.t-b.t);
}
function cumul(E,aid,rg){
 const ev=events(E,aid,rg),n=Array(NL()+1).fill(0);ev.forEach(e=>n[e.p]++);
 const tot=ev.length,ok=n.slice(OK()).reduce((a,b)=>a+b,0),last=tot?ev[tot-1].p:0,best=ev.reduce((m,e)=>Math.max(m,e.p),0);
 const taux=tot?ok/tot:null;let val=null;
 if(tot){const m=S.cfg.mode;val=m==='meilleure'?best>=OK():m==='taux'?taux*100>=S.cfg.seuil:last>=OK()}
 return{ev,n,tot,ok,last,best,taux,val};
}
function sumCum(list){const n=Array(NL()+1).fill(0);let tot=0,ok=0,v=0,ev=0;list.forEach(c=>{c.n.forEach((x,i)=>n[i]+=x);tot+=c.tot;ok+=c.ok;if(c.tot){ev++;if(c.val)v++}});return{n,tot,ok,taux:tot?ok/tot:null,valides:v,evalues:ev}}
function syOf(ts){const d=new Date(ts);return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1}
function mdDate(sy,md){const[m,d]=String(md).split('-').map(Number);return new Date(m>=8?sy:sy+1,m-1,d).getTime()}
function range(sy,t){const T=S.cfg.trims,a=new Date(sy,7,1).getTime(),b=mdDate(sy,T.t2),c=mdDate(sy,T.t3),e=new Date(sy+1,7,1).getTime();return t===1?[a,b]:t===2?[b,c]:t===3?[c,e]:[a,e]}
const CUR_SY=syOf(Date.now());
const syLabel=sy=>sy+'-'+(sy+1);
/* Période : y = année scolaire ou 'all' ; p = 0 (année entière) ou 1..3 */
const rgOf=(y,p)=>y==='all'?null:range(+y,p||0);
const perName=(y,p)=>y==='all'?'Toute la scolarité':(p?'Trimestre '+p+' · ':'Année ')+syLabel(+y);
const tauxTxt=t=>t===null?'—':Math.round(t*100)+' %';
const tauxCls=t=>t===null?'c0':t>=.75?'c3':t>=.5?'c2':'c1';
const modeTxt=()=>({derniere:'dernière évaluation « '+L(OK()).nom+' »',meilleure:'au moins une évaluation « '+L(OK()).nom+' »',taux:'taux de réussite d\u2019au moins '+S.cfg.seuil+' %'})[S.cfg.mode];

/* ===== Composants ===== */
function logosHtml(cls='lg'){const l=(S.cfg&&S.cfg.logos)||{},e=l.ecole||LOGO_ESTIC,p=l.perso||LOGO_PERSO;
 return `<span class="${cls}">${e?`<img src="${e}" alt="Logo de l\u2019établissement">`:''}${p?`<img src="${p}" alt="Logo du professeur">`:''}</span>`}
const brand=(t,s)=>`<div class="brand">${logosHtml()}<div><h1>${esc(t)}</h1>${s?`<div class="sub">${esc(s)}</div>`:''}</div></div>`;
const TUTO_BTN='<button class="tuto-btn" type="button" data-act="tuto"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 6.5v7l5.5-3.5z" fill="currentColor"/></svg>Tuto</button>';
const backBtn=(to,l='Retour')=>`<button class="back" data-act="back" data-to="${to}">&larr; ${l}</button>`;
function ring(p,lab){const r=46,C=2*Math.PI*r,v=p===null?0:p;return `<svg width="118" height="118" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" style="stroke:#e6e9f0" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" style="stroke:var(--n3)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*v).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 55 55)"/><text x="55" y="58" text-anchor="middle" font-size="22" font-weight="900" style="fill:var(--ink)" font-family="Nunito,sans-serif">${p===null?'—':Math.round(v*100)+'%'}</text><text x="55" y="75" text-anchor="middle" font-size="10" font-weight="800" style="fill:var(--mu)" font-family="Nunito,sans-serif">${esc(lab||'réussite')}</text></svg>`}
const legend=()=>`<div class="legend">${lvls().map(n=>`<span><i class="sw s${n}"></i>${L(n).s} : ${L(n).nom}</span>`).join('')}</div>`;
const lvTag=(n,cls='mini')=>`<span class="${cls} c${n||0}" title="${n?esc(L(n).nom):'Non évalué'}">${n?L(n).s:'–'}</span>`;
function askBtn(key,label,cls='ghost danger'){
 if(S.confirm===key)return `<span class="confirm">Confirmer ? <button class="btn sm danger" data-act="ok" data-k="${esc(key)}">Oui</button><button class="btn sm ghost" data-act="cancel">Non</button></span>`;
 return `<button class="btn sm ${cls}" data-act="ask" data-k="${esc(key)}">${label}</button>`}
function stack(k,tot){return `<div class="stack">${lvls().map(l=>k[l]?`<i style="width:${k[l]/tot*100}%;background:var(--n${l})" title="${esc(L(l).nom)} : ${k[l]}"></i>`:'').join('')}</div>`}
const cnt=(v,l)=>`<span class="cnt ${v?'c'+l:'z'}">${v}</span>`;
const pbar=t=>`<span class="pbar"><i class="${tauxCls(t)}" style="width:${t===null?0:Math.round(t*100)}%"></i></span><b class="pv">${tauxTxt(t)}</b>`;
const statut=c=>!c.tot?'<span class="st s0">Non évalué</span>':c.val?'<span class="st s3">Validé</span>':'<span class="st s1">Non validé</span>';
function histo(c,editable){return `<span class="hist">${c.ev.map(e=>{const sel=S.evSel&&S.evSel.tid===e.tid&&S.evSel.aid===e.aid;
 const t=`${srcName(e.tid)} · ${fdate(e.t)} · ${L(e.p).nom}`;
 return editable?`<button class="hd c${e.p} ${sel?'sel':''}" data-act="evsel" data-t="${esc(e.tid)}" data-a="${esc(e.aid)}" title="${esc(t)}">${L(e.p).s}</button>`:`<span class="hd c${e.p}" title="${esc(t)}">${L(e.p).s}</span>`}).join('')}</span>`}
const NIV_ORDER=['6e','5e','4e','3e','Seconde','Première','Terminale','Autres'];
function nivKey(c){if(/^2/.test(c))return 'Seconde';if(/^1/.test(c))return 'Première';if(/^T/i.test(c))return 'Terminale';const m=String(c).match(/^([3-6])/);return m?m[1]+'e':'Autres'}
function groupClasses(cl){const g={};cl.forEach(c=>{const k=nivKey(c);(g[k]=g[k]||[]).push(c)});return NIV_ORDER.filter(k=>g[k]).map(k=>[k,g[k]])}

/* ----- Tableau de bilan (commun prof, élève, impression) ----- */
function bilanData(E,rg){
 const aids=allAids(),C={};aids.forEach(a=>C[a]=cumul(E,a,rg));
 return{aids,C,tot:sumCum(aids.map(a=>C[a]))};
}
function bilanTable(E,rg,opt){
 const{aids,C}=bilanData(E,rg),A=S.cfg.actions,CC=S.cfg.competences,ed=opt.edit,pr=opt.print,N=NL(),ncol=6+N+(ed?1:0);
 const filt=opt.onlyEval?aids.filter(a=>C[a].tot):aids;
 if(!filt.length)return '<div class="card empty">Aucune évaluation sur cette période.</div>';
 const head=`<tr><th class="cd"></th><th class="tl">Critère</th>${lvls().map(n=>`<th class="nc" title="${esc(L(n).nom)}"><span class="mini c${n}">${L(n).s}</span></th>`).join('')}<th class="nc">Total</th><th class="pc">Réussite</th>${pr?'':'<th class="hc2">Historique</th>'}<th class="sc">Statut</th>${ed?'<th class="ac2">Ajouter</th>':''}</tr>`;
 const body=byBloc(groupByComp(filt)).map(([b,gs])=>{const bs=sumCum(gs.flatMap(([,as])=>as.map(a=>C[a])));
  return `<tr class="bh"><td colspan="${ncol-(pr?1:0)}"><span style="color:${blocColor(b)}">${esc(blocName(b))}</span><span class="bhs">${bs.tot?`${bs.tot} éval. · réussite ${tauxTxt(bs.taux)} · ${bs.valides}/${bs.evalues} validés`:'aucune évaluation'}</span></td></tr>`+
  gs.map(([cid,as])=>{const s=sumCum(as.map(a=>C[a])),open=pr||opt.allOpen||S.openSC[cid];
   const ch=`<tr class="ch" ${pr?'':`data-act="scomp" data-c="${esc(cid)}"`}><td class="cd"><span class="chip" style="background:${compColor(cid)}">${esc(CC[cid].code)}</span></td><td class="tl">${pr?'':`<span class="car">${open?'&#9662;':'&#9656;'}</span>`}${esc(CC[cid].lib)}</td>${lvls().map(n=>`<td class="nc">${cnt(s.n[n],n)}</td>`).join('')}<td class="nc"><b>${s.tot}</b></td><td class="pc">${pbar(s.taux)}</td>${pr?'':'<td class="hc2"></td>'}<td class="sc"><span class="sub">${s.valides}/${as.length} validés</span></td>${ed?'<td></td>':''}</tr>`;
   if(!open)return ch;
   return ch+as.map(a=>{const c=C[a];return `<tr class="ar"><td class="cd">${esc(A[a].code)}</td><td class="tl" title="${esc((A[a].ind||[]).join(' • '))}">${esc(opt.eleve&&A[a].el?A[a].el:A[a].lib)}</td>${lvls().map(n=>`<td class="nc">${cnt(c.n[n],n)}</td>`).join('')}<td class="nc">${c.tot||''}</td><td class="pc">${c.tot?pbar(c.taux):''}</td>${pr?'':`<td class="hc2">${histo(c,ed)}</td>`}<td class="sc">${statut(c)}</td>${ed?`<td class="ac2"><span class="seg">${lvls().map(n=>`<button class="sg c${n}" data-act="dir" data-a="${esc(a)}" data-n="${n}" title="Ajouter une évaluation hors TP : ${esc(L(n).nom)}">+${L(n).s}</button>`).join('')}</span></td>`:''}</tr>`}).join('')}).join('')}).join('');
 return `<div class="scroll"><table class="bil ${pr?'pr':''}"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function sumCards(tot,cmp){
 const N=NL();
 return `<div class="fsum"><div class="fs"><b>Évaluations</b><div class="v">${tot.tot}</div><div class="n">${lvls().map(n=>`${tot.n[n]} ${L(n).s}`).join(' · ')}</div></div>
 <div class="fs"><b>Taux de réussite</b><div class="v">${tauxTxt(tot.taux)}</div><div class="n">${tot.ok} « ${esc(L(OK()).nom)} » sur ${tot.tot}</div></div>
 <div class="fs"><b>Critères validés</b><div class="v">${tot.valides}<span class="of">/${tot.evalues}</span></div><div class="n">sur ${pl(tot.evalues,'critère')} ${tot.evalues>1?'évalués':'évalué'}</div></div>
 <div class="fs"><b>« ${esc(L(1).nom)} »</b><div class="v" style="color:var(--n1)">${tot.n[1]}</div><div class="n">fois sur la période</div></div></div>`;
}

function vAdmin(){

 return `<div class="adm"><nav class="side"><div class="sbrand">${logosHtml('lg sm')}<div class="sub">${esc(S.cfg.titre||'Espace professeur')}</div></div>${TUTO_BTN}
 ${ATABS.map(([k,l,i])=>`<button class="it ${S.a===k?'on':''}" data-act="atab" data-t="${k}">${ICO[i]}<span>${l}</span></button>`).join('')}
 <div class="sp"></div><button class="it" data-act="refresh">${ICO.ref}<span>Actualiser</span></button><button class="it" data-act="logout-admin">${ICO.out}<span>Quitter</span></button></nav>
 <main class="main">${main}</main></div>${S.ficheEid?vFiche():''}${S.cell&&S.a==='eval'?vPicker():''}`;
}
const classSel=()=>`<select class="inp" data-chg="ac">${S.cfg.classes.map(c=>`<option value="${esc(c)}" ${c===S.ac?'selected':''}>${esc(c)} (${elevesOf(c).length})</option>`).join('')}</select>`;
const aHead=(t,x='')=>`<div class="ahead"><h2>${t}</h2><div class="tools">${x}</div></div>`;
function elevesOf(c){return Object.entries((S.db&&S.db.eleves||{})[c]||{}).sort((a,b)=>(a[1].nom+' '+a[1].prenom).localeCompare(b[1].nom+' '+b[1].prenom,'fr'))}
function evOf(c,eid){const e=S.db.evals;return (e[c]&&e[c][eid])||{}}
function tpsOf(c){return Object.entries(S.cfg.tps||{}).filter(([,t])=>(t.classes||[]).includes(c)).sort((a,b)=>(b[1].cree||0)-(a[1].cree||0))}
const perChipsY=()=>`<div class="per">${[0,1,2,3].map(t=>`<button class="pchip ${S.per===t?'on':''}" data-act="per" data-t="${t}">${t?'T'+t:'Année'}</button>`).join('')}</div>`;

function stats(c,rg){
 const els=elevesOf(c),aids=allAids(),M={},T={},evd=new Set(),all=[];
 els.forEach(([e])=>{const E=evOf(c,e);M[e]={};aids.forEach(a=>{const k=cumul(E,a,rg);M[e][a]=k;if(k.tot){evd.add(a);all.push(k)}});T[e]=sumCum(aids.map(a=>M[e][a]))});
 return{els,aids,M,T,evd,tot:sumCum(all)};
}

function aDash(){
 const c=S.ac,rg=rgOf(CUR_SY,S.per),st=stats(c,rg);
 const tiles=S.cfg.classes.filter(k=>elevesOf(k).length).map(k=>{const s=k===c?st:stats(k,rg),t=s.tot.taux;
  return `<button class="ctile ${k===c?'on':''}" data-act="pick-ac" data-c="${esc(k)}"><b>${esc(k)}</b><span>${t===null?'—':'réussite '+Math.round(t*100)+' %'}</span><i style="width:${t===null?0:Math.round(t*100)}%"></i></button>`}).join('');
 const tools=perChipsY()+classSel()+(st.els.length?`<button class="btn sm sec" data-act="print-class">${ICO.print}Imprimer les bilans</button>`:'');
 const head=aHead('Tableau de bord',tools)+(tiles?`<div class="ctiles">${tiles}</div>`:'');
 if(!st.els.length)return head+'<div class="card empty">Aucun élève dans cette classe. Ajoute-les dans l\u2019onglet Élèves.</div>';
 const C=S.cfg.competences,A=S.cfg.actions,n=st.els.length,total=allAids().length,ev=st.tot;
 const kpis=`<div class="kpis"><div class="kpi"><div class="v">${n}</div><div class="k">Élèves</div></div>
  <div class="kpi"><div class="v">${ev.tot}</div><div class="k">Évaluations saisies · ${S.per?'T'+S.per:'année'}</div></div>
  <div class="kpi"><div class="v" style="color:var(--n3)">${tauxTxt(ev.taux)}</div><div class="k">Taux de réussite</div></div>
  <div class="kpi"><div class="v" style="color:var(--n1)">${ev.n[1]}</div><div class="k">« ${esc(L(1).nom)} »</div></div>
  <div class="kpi"><div class="v">${st.evd.size}<span class="of">/${total}</span></div><div class="k">Critères travaillés</div></div></div>`;
 if(!ev.tot)return head+kpis+'<div class="card empty">Aucune évaluation sur cette période. Saisis les résultats d\u2019un TP dans « Saisir un TP », ou ajoute une évaluation depuis la fiche d\u2019un élève.</div>';
 const groups=groupByComp(allAids()).filter(([,as])=>as.some(a=>st.evd.has(a)));
 const bars=groups.map(([cid,as])=>{const s=sumCum(st.els.flatMap(([e])=>as.map(a=>st.M[e][a]))),open=!!S.openC[cid];
  let h=`<button class="brow" data-act="opencomp" data-c="${esc(cid)}"><div class="bl" title="${esc(C[cid].lib)}"><b>${open?'&#9662;':'&#9656;'} ${esc(C[cid].code)}</b>${esc(C[cid].lib)}</div>${stack(s.n,s.tot)}<div class="bp">${tauxTxt(s.taux)}</div><div class="bn">${s.tot} éval.</div></button>`;
  if(open)h+=as.filter(a=>st.evd.has(a)).map(a=>{const s2=sumCum(st.els.map(([e])=>st.M[e][a]));
   return `<div class="brow subr"><div class="bl" title="${esc(A[a].lib)}"><b>${esc(A[a].code)}</b>${esc(A[a].lib)}</div>${stack(s2.n,s2.tot)}<div class="bp">${tauxTxt(s2.taux)}</div><div class="bn">${s2.tot} éval.</div></div>`}).join('');
  return h}).join('');
 const hm=`<div class="scroll"><table class="hm"><thead><tr><th></th>${groups.map(([cid])=>`<th title="${esc(C[cid].lib)}">${esc(C[cid].code)}</th>`).join('')}<th>Éval.</th><th>${esc(L(1).s)}</th><th>Réussite</th><th>Validés</th></tr></thead><tbody>
 ${st.els.map(([e,el])=>{const T=st.T[e];return `<tr><td class="nm"><button class="nmb" data-act="fiche" data-id="${esc(e)}">${esc(el.nom)} ${esc(el.prenom)}</button></td>${groups.map(([cid,as])=>{const s=sumCum(as.map(a=>st.M[e][a]));
  return `<td><span class="hc ${tauxCls(s.taux)}" title="${esc(el.prenom)} — ${esc(C[cid].code)} : ${s.tot} évaluation(s), ${s.n[1]} ${L(1).s}, réussite ${tauxTxt(s.taux)}">${s.tot?Math.round(s.taux*100)+'%':'—'}</span></td>`}).join('')}
  <td class="num">${T.tot}</td><td class="num" style="color:var(--n1)">${T.n[1]||''}</td><td class="num"><b>${tauxTxt(T.taux)}</b></td><td class="num">${T.valides}/${T.evalues}</td></tr>`}).join('')}</tbody></table></div>`;
 const aide=st.els.map(([e,el])=>({e,el,T:st.T[e]})).filter(x=>x.T.tot>=3&&(x.T.n[1]>=3||x.T.taux<.4)).sort((a,b)=>a.T.taux-b.T.taux);
 const aideH=aide.length?aide.map(x=>`<div class="lrow"><button class="nmb" data-act="fiche" data-id="${esc(x.e)}">${esc(x.el.nom)} ${esc(x.el.prenom)}</button><span><span class="badge b1">${x.T.n[1]} ${L(1).s}</span> <span class="badge b0">réussite ${tauxTxt(x.T.taux)}</span></span></div>`).join(''):'<div class="sub">Aucun élève en difficulté repéré.</div>';
 const dif=[...st.evd].map(a=>({a,s:sumCum(st.els.map(([e])=>st.M[e][a]))})).filter(x=>x.s.tot>=3).sort((x,y)=>x.s.taux-y.s.taux||y.s.n[1]-x.s.n[1]).slice(0,6);
 const difH=dif.length?dif.map(x=>`<div class="lrow"><span><b class="code">${esc(A[x.a].code)}</b> ${esc(A[x.a].lib)}</span><span class="nowrap"><span class="badge b1">${x.s.n[1]} ${L(1).s}</span> <span class="badge ${'b'+tauxCls(x.s.taux).slice(1)}">${tauxTxt(x.s.taux)}</span></span></div>`).join(''):'<div class="sub">Pas encore assez d\u2019évaluations.</div>';
 const miss=allAids().filter(a=>!st.evd.has(a)),mg=groupByComp(miss);
 const covH=miss.length?mg.map(([cid,as])=>`<div class="lrow" style="display:block"><b>${esc(C[cid].code)}</b> <span class="sub">${esc(C[cid].lib)}</span><div class="cov">${as.map(a=>`<span title="${esc(A[a].lib)}">${esc(A[a].code)}</span>`).join('')}</div></div>`).join(''):'<div class="sub">Tout le référentiel a été évalué au moins une fois.</div>';
 return head+kpis+`<div class="card sec"><h3>Cumul des évaluations par compétence</h3><div class="sub">Chaque barre additionne toutes les évaluations de la classe · clique sur une compétence pour le détail des critères</div>${legend()}${bars}</div>
 <div class="card sec"><h3>Carte de la classe</h3><div class="sub">Taux de réussite par compétence · clique sur un nom pour ouvrir le bilan de l\u2019élève</div>${hm}</div>
 <div class="cols sec"><div class="card"><h3>Élèves à accompagner</h3><div class="sub">Au moins 3 « ${esc(L(1).nom)} » ou réussite sous 40 %</div>${aideH}</div>
 <div class="card"><h3>Critères les plus difficiles</h3><div class="sub">Plus faible taux de réussite de la classe</div>${difH}</div></div>
 <div class="card sec"><h3>Critères jamais évalués (${miss.length})</h3><div class="sub">À planifier dans les prochains TP</div>${covH}</div>`;
}

function ficheYears(E){const ys=new Set([CUR_SY]);for(const t in E)for(const a in E[t]||{}){const x=E[t][a];if(x&&x.tq)ys.add(syOf(x.tq))}return [...ys].sort((a,b)=>b-a)}

function aEval(){

 const tpSel=Lt.length?`<select class="inp" data-chg="atp">${Lt.map(([id,t])=>`<option value="${esc(id)}" ${id===S.atp?'selected':''}>${esc(t.titre)}</option>`).join('')}</select>`:'';
 const head=aHead('Saisir les résultats d\u2019un TP',classSel()+tpSel);
 if(!Lt.length)return head+'<div class="card empty">Aucun TP pour cette classe.<br><br><button class="btn" data-act="atab" data-t="tps">Créer un TP</button></div>';
 const els=elevesOf(c);if(!els.length)return head+'<div class="card empty">Aucun élève dans cette classe.</div>';
 const t=S.cfg.tps[S.atp],as=tpActs(t),C=S.cfg.competences,A=S.cfg.actions,groups=groupByComp(as);
 let done=0;els.forEach(([e])=>{const R=evOf(c,e)[S.atp]||{};as.forEach(a=>{if(R[a]&&R[a].p)done++})});
 const tbl=`<div class="card scroll"><table class="ev"><thead><tr><th></th>${groups.map(([cid,g])=>`<th class="gh" colspan="${g.length}" style="border-bottom:3px solid ${compColor(cid)}" title="${esc(C[cid].lib)}">${esc(C[cid].code)}</th>`).join('')}</tr>
 <tr><th></th>${as.map(a=>`<th title="${esc(A[a].lib)}">${esc(A[a].code)}</th>`).join('')}</tr></thead><tbody>
 ${els.map(([e,el])=>{const R=evOf(c,e)[S.atp]||{};return `<tr><td class="nm"><button class="nmb" data-act="fiche" data-id="${esc(e)}">${esc(el.nom)} ${esc(el.prenom)}</button></td>${as.map(a=>{const x=R[a]||{},sel=S.cell&&S.cell.e===e&&S.cell.c===a;
  return `<td><button class="cellb c${x.p||0} ${sel?'sel':''}" data-act="cell" data-e="${esc(e)}" data-c="${esc(a)}" title="${esc(A[a].code)} · ${x.p?esc(L(x.p).nom):'non évalué'}">${x.p?L(x.p).s:''}</button></td>`}).join('')}</tr>`}).join('')}</tbody></table></div>`;
 return head+`<div class="bar">${legend()}<span class="sp"></span><span class="sub">${done}/${els.length*as.length} cases remplies</span></div>
 <div class="hint">Clique une case puis tape 1 à ${NL()} (${lvls().map(n=>n+' = '+L(n).s).join(', ')}), 0 pour effacer, flèches pour te déplacer. Chaque TP s\u2019ajoute au cumul de l\u2019élève.</div>${tbl}`;

function pressKey(k){
 if(Date.now()<S.lock)return;
 if(k==='del'){S.code=S.code.slice(0,-1);S.msg='';render();return}
 if(S.code.length>=4)return;S.code+=k;S.msg='';render();

async function checkCode(){
 const e=S.eleves&&S.eleves[S.eid];if(!e||S.v!=='code')return;
 if(String(e.code)===S.code){S.fails=0;S.code='';S.v='eleve';S.stab='bilan';S.per=0;S.mine=null;S.openSC={};render();await reloadMine()}
 else{S.fails++;S.code='';S.msg='Code incorrect';if(S.fails>=5){S.fails=0;S.lock=Date.now()+30000;tickLock()}render()}
}
function tickLock(){if(S.v!=='code')return;if(Date.now()<S.lock){render();setTimeout(tickLock,1000)}else{S.msg='';render()}}

function parseNames(t){
 return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{let nom,prenom;
  if(/[;\t]/.test(l)){[nom,prenom]=l.split(/[;\t]/).map(s=>s.trim())}
  else{const w=l.split(/\s+/);let k=0;while(k<w.length-1&&w[k]===w[k].toUpperCase()&&/\p{L}/u.test(w[k]))k++;if(k===0)k=1;nom=w.slice(0,k).join(' ');prenom=w.slice(k).join(' ')}
  return{nom:(nom||'').toUpperCase(),prenom:prenom||''}}).filter(x=>x.nom);
}

function loadLogo(file,k){
 if(!file||!/^image\//.test(file.type))return toast('Choisis une image',true);
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{
  const max=k==='ecole'?480:320,sc=Math.min(1,max/im.width,160/im.height),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
  let url=cv.toDataURL('image/png');if(url.length>180000)url=cv.toDataURL('image/webp',.9);
  if(url.length>250000)return toast('Image trop lourde',true);
  S.cfg.logos=S.cfg.logos||{};S.cfg.logos[k]=url;render();if(await safe(Store.put(`config/logos/${k}`,url)))toast('Logo enregistré')};
  im.onerror=()=>toast('Image illisible',true);im.src=r.result};r.readAsDataURL(file);
}
function csvLine(a){return a.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')}
function exportCsv(){
 const rg=rgOf(CUR_SY,S.per),st=stats(S.ac,rg),C=S.cfg.competences,gs=groupByComp(allAids());
 const hd=['Nom','Prénom',...gs.map(([cid])=>C[cid].code+' réussite %'),'Évaluations',...lvls().map(n=>'Nb '+L(n).s),'Réussite %','Critères validés','Critères évalués'];
 const rows=[csvLine(hd)].concat(st.els.map(([e,el])=>{const T=st.T[e];return csvLine([el.nom,el.prenom,...gs.map(([,as])=>{const s=sumCum(as.map(a=>st.M[e][a]));return s.tot?Math.round(s.taux*100):''}),T.tot,...lvls().map(n=>T.n[n]),T.tot?Math.round(T.taux*100):'',T.valides,T.evalues])}));
 download(`competences-${S.ac}-${S.per?'T'+S.per:'annee'}-${today()}.csv`,'﻿'+rows.join('\r\n'),'text/csv;charset=utf-8');

  return csvLine([CC[A[a].comp].code,A[a].code,A[a].lib,...lvls().map(n=>k.n[n]),k.tot,k.tot?Math.round(k.taux*100):'',!k.tot?'Non évalué':k.val?'Validé':'Non validé',k.ev.map(x=>fdate(x.t)+' '+L(x.p).s).join(', ')])}));

const CHG={

 atp:b=>{S.atp=b.value;S.cell=null;S.confirm=null;render()},

 import:b=>{const f=b.files&&b.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o||!o.config)throw new Error();S.pendingImport=o;S.confirm='import';render()}catch(e){toast('Fichier de sauvegarde invalide',true)}})}
};
const INP={'ed-titre':b=>{S.edTp.titre=b.value},ea:b=>{S.edAct[b.dataset.f]=b.value},ec:b=>{S.edComp[b.dataset.f]=b.value}};

document.addEventListener('click',e=>{if(e.target.id==='tutoBox'){closeTuto();return}const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset)});
document.addEventListener('change',e=>{const b=e.target.closest('[data-chg]');if(b&&CHG[b.dataset.chg])CHG[b.dataset.chg](b)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-inp]');if(b&&INP[b.dataset.inp])INP[b.dataset.inp](b)});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(e.key==='Escape'&&!document.getElementById('tutoBox').hidden){closeTuto();return}
 if(t.matches&&t.matches('input,textarea,select')){if(e.key==='Enter'&&t.dataset.enter&&ACT[t.dataset.enter]){e.preventDefault();ACT[t.dataset.enter]({})}return}
 if(S.v==='code'){if(/^[0-9]$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('del');return}
 if(e.key==='Escape'&&S.ficheEid){if(S.evSel){S.evSel=null;S.confirm=null}else S.ficheEid=null;render();return}
 if(S.v==='admin'&&S.a==='eval'&&S.cell){
  const mv={ArrowDown:[1,0],ArrowUp:[-1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if(/^[1-9]$/.test(e.key)&&+e.key<=NL()){e.preventDefault();setProf(+e.key)}
  else if(e.key==='0'||e.key==='Delete'||e.key==='Backspace'){e.preventDefault();setProf(0)}
  else if(mv){e.preventDefault();moveCell(mv[0],mv[1]);render()}
  else if(e.key==='Escape'){S.cell=null;render()}
 }
});
setInterval(async()=>{
 const idle=()=>S.v==='admin'&&(S.a==='dash'||S.a==='eval')&&!S.cell&&!S.ficheEid&&!S.confirm&&document.visibilityState==='visible'&&!document.body.classList.contains('printing');
 if(idle()){await loadDb();if(idle())render()}
},25000);
